[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-v19-core"
version = "19.2.0"
description = "MITRE ATT&CK v19 Core Data Models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4"
dependencies = [
    "mitreattack-python==6.2.0",
    "pydantic==2.13.4",
]

[project.scripts]
attack-v19 = "attack_core.cli:main"

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "check-wheel-contents==0.6.3",
    "pyright==1.1.388",
    "pytest==9.1.1",
    "ruff==0.8.4",
]
security = [
    "bandit==1.8.3",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["attack_core*", "attack_v19_core*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
