name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.8.4"
  PYRIGHT_VERSION: "1.1.388"
  BANDIT_VERSION: "1.8.3"
  PIP_AUDIT_VERSION: "2.10.1"
  CYCLONEDX_VERSION: "5.1.1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==${{ env.RUFF_VERSION }}
      - run: ruff check attack_core tests scripts --output-format=github
      - run: ruff format attack_core tests scripts

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyright==${{ env.PYRIGHT_VERSION }}
          pip install -e ".[dev]"
      - name: Focused type check
        run: PYTHONPATH=. pyright attack_core/models.py attack_core/constants.py attack_core/mapping.py

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==${{ env.BANDIT_VERSION }} pip-audit==${{ env.PIP_AUDIT_VERSION }} cyclonedx-bom==${{ env.CYCLONEDX_VERSION }}
          pip install -e ".[dev]"
      - name: Bandit SAST
        run: bandit -r attack_core -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt --skip-editable
      - name: Generate SBOM
        run: cyclonedx-py environment --output-format JSON --outfile sbom.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python scripts/download_attack_data.py
      - run: pytest tests/ -v --tb=short --maxfail=5
