name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install uv==0.11.16
      - run: uv sync --locked --extra dev
      - run: uv run ruff check attack_core tests scripts --output-format=github
      - run: uv run ruff format --check attack_core tests scripts

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.16
          uv sync --locked --extra dev
      - name: Type check package
        run: uv run pyright attack_core scripts/download_attack_data.py

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install security tools
        run: |
          python -m pip install uv==0.11.16
          uv sync --locked --extra security
      - name: Bandit SAST
        run: uv run bandit -r attack_core scripts -ll
      - name: Export locked dependency graphs
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file locked-runtime-requirements.txt
          uv export --locked --all-extras --no-emit-project --format requirements-txt --output-file locked-all-requirements.txt
      - name: Audit runtime and tooling dependencies
        run: |
          uv run pip-audit --requirement locked-runtime-requirements.txt
          uv run pip-audit --requirement locked-all-requirements.txt
      - name: Generate runtime SBOM
        run: uv run pip-audit --requirement locked-runtime-requirements.txt --format cyclonedx-json --output sbom.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.16
          uv sync --locked --extra dev
          uv run python scripts/download_attack_data.py
      - run: uv run pytest tests/ -v --tb=short --maxfail=5

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install uv==0.11.16
      - run: uv sync --locked --extra dev
      - run: uv build
      - run: uv run check-wheel-contents --toplevel attack_core,attack_v19_core dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/
          retention-days: 30
