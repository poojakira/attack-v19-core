name: MITRE ATT&CK Upstream Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-v19:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Download pinned MITRE ATT&CK v19.2 bundles
        run: python -m attack_v19_core.download --data-dir validation/upstream --force
      - name: Validate official v19 facts and mappings
        env:
          ATTACK_DATA_DIR: ${{ github.workspace }}/validation/upstream
        run: |
          python -m pytest tests/test_official_validation.py tests/test_integration_v19_chain.py -q
      - name: Record upstream bundle digests
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("validation/upstream")
          rows = {}
          for p in sorted(root.glob("*.json")):
              rows[p.name] = hashlib.sha256(p.read_bytes()).hexdigest()
          Path("validation/upstream-validation.json").write_text(
              json.dumps({
                  "source": "MITRE attack-stix-data v19.2",
                  "bundle_sha256": rows,
                  "claim_boundary": "Upstream data compatibility only; this library is not a detector."
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mitre-attack-upstream-validation
          path: validation/upstream-validation.json
