# Publish to PyPI with Sigstore signing, SBOM generation, and attestation
# Uses Trusted Publisher (OIDC) — no API tokens stored in secrets
name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # Required for Trusted Publisher OIDC + Sigstore

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CycloneDX
        run: pip install cyclonedx-bom

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          cyclonedx-py environment \
            --output sbom.cdx.json \
            --format json \
            --schema-version 1.5

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  sign:
    name: Sign with Sigstore
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install sigstore
        run: pip install sigstore

      - name: Sign all distribution files
        run: |
          for file in dist/*; do
            sigstore sign "$file"
          done

      - name: Upload signatures
        uses: actions/upload-artifact@v4
        with:
          name: sigstore-signatures
          path: dist/*.sigstore.json
          retention-days: 90

  attest:
    name: Generate build attestation
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, sign, attest]
    environment:
      name: pypi
      url: https://pypi.org/project/attack-core/
    permissions:
      id-token: write  # Trusted Publisher OIDC
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token needed — uses OIDC Trusted Publisher

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, generate-sbom, sign]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/dist/*
            artifacts/sigstore-signatures/*
            artifacts/sbom/sbom.cdx.json
          body: |
            ## Verification

            All distribution files are signed with [Sigstore](https://www.sigstore.dev/).
            Verify with:

            ```bash
            pip install sigstore
            sigstore verify identity \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --cert-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }} \
              attack_core-*.tar.gz
            ```

            ## SBOM

            A CycloneDX SBOM is attached to this release (`sbom.cdx.json`).
